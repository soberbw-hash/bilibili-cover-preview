<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B站封面预览</title>
  <style>
    :root {
      --pink: #fb7299;
      --blue: #00aeec;
      --text: #18191c;
      --muted: #9499a0;
      --line: #e7e9ee;
      --page: #f5f6f8;
      --card: #ffffff;
      --soft: #f6f7f9;
      --phone-width: min(430px, calc(100vw - 24px));
      --bili-content: min(1320px, calc(100vw - 48px));
      --bili-gap: 20px;
      --bili-card-width: calc((var(--bili-content) - 4 * var(--bili-gap)) / 5);
      --bili-card-height: calc(var(--bili-card-width) / 16 * 9 + 75px);
      --bili-feature-height: calc(var(--bili-card-height) * 2 + var(--bili-gap));
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--page);
    }
    body.dark {
      --text: #f1f2f3;
      --muted: #a8adb4;
      --line: #2f333b;
      --page: #111316;
      --card: #181a1f;
      --soft: #20232a;
    }
    button { font: inherit; }
    input[type="file"] { display: none; }

    .app {
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 10px 8px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      border-left: 0;
      border-right: 0;
      border-top: 0;
      border-radius: 0;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 26px rgba(0,0,0,.08);
      opacity: 1;
    }
    .topbar::after {
      content: none;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 220px;
    }
    .brand strong {
      font-size: 15px;
      letter-spacing: .2px;
    }
    .brand span {
      color: var(--muted);
      font-size: 12px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 0;
      width: 100%;
    }
    .title-bar[hidden] { display: none; }
    .title-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }
    .title-input {
      flex: 1;
      height: 32px;
      border: 1px solid var(--pink);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
    }
    .title-input::placeholder { color: var(--muted); }
    .title-input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 2px rgba(251,114,153,0.15); }
    /* highlight mode: pink glow on user's cover */
    .highlight-mode .cover.mine {
      outline: 3px solid var(--pink);
      outline-offset: -3px;
      box-shadow: 0 0 12px rgba(251,114,153,0.5);
      border-radius: 8px;
    }
    .btn,
    .seg button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }
    .btn.primary {
      color: #fff;
      background: var(--pink);
      border-color: var(--pink);
    }
    .btn:hover,
    .seg button:hover { border-color: var(--pink); }
    .seg {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--soft);
      gap: 3px;
    }
    .seg button {
      border: 0;
      background: transparent;
      height: 26px;
      border-radius: 7px;
      color: var(--muted);
    }
    .seg button.active {
      background: var(--card);
      color: var(--pink);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
    }

    .stage {
      width: 100%;
      margin: 0;
    }
    .desktop-view,
    .phone-wrap { display: none; }
    .app.mode-desktop .desktop-view { display: block; }
    .app.mode-phone .phone-wrap { display: flex; }

    .desktop-view {
      background: var(--card);
      border: 0;
      border-radius: 0;
      overflow: hidden;
      min-height: 100vh;
      position: relative;
    }
    .web-nav {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 3;
      height: 64px;
      display: grid;
      grid-template-columns: minmax(360px, 552px) 484px max-content;
      align-items: center;
      gap: 22px;
      padding: 0 28px;
      border-bottom: 0;
      color: #fff;
      background: linear-gradient(to bottom, rgba(0,0,0,.25), transparent);
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,.35);
    }
    .banner {
      position: relative;
      height: 155px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 0 0 24px 72px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.06) 45%, rgba(255,255,255,.88)),
        radial-gradient(ellipse at 72% 18%, rgba(255,255,255,.65) 0 7%, transparent 8%),
        radial-gradient(ellipse at 34% 100%, rgba(80,138,87,.42) 0 24%, transparent 25%),
        linear-gradient(168deg, transparent 0 58%, rgba(232,185,96,.65) 59% 66%, transparent 67%),
        linear-gradient(12deg, rgba(74,139,70,.40) 0 23%, transparent 24%),
        linear-gradient(120deg, #b7dba7, #d7ebf3 45%, #f3d08d);
      border-bottom: 1px solid var(--line);
    }
    body.dark .banner {
      background:
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.10) 45%, rgba(24,26,31,.92)),
        radial-gradient(ellipse at 72% 18%, rgba(255,255,255,.16) 0 7%, transparent 8%),
        radial-gradient(ellipse at 34% 100%, rgba(60,98,64,.58) 0 24%, transparent 25%),
        linear-gradient(168deg, transparent 0 58%, rgba(126,96,45,.45) 59% 66%, transparent 67%),
        linear-gradient(12deg, rgba(47,86,50,.45) 0 23%, transparent 24%),
        linear-gradient(120deg, #38513f, #273c49 45%, #4a3921);
    }
    .screenshot-safe .banner {
      background:
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.04) 45%, rgba(255,255,255,.88)),
        linear-gradient(120deg, #b7dba7, #d7ebf3 45%, #f3d08d) !important;
    }
    .screenshot-safe .channels span,
    .screenshot-safe .links span,
    .screenshot-safe .tabs {
      color: #61666d !important;
    }
    .screenshot-safe .selected .cover {
      outline-color: rgba(251,114,153,.7) !important;
    }
    .screenshot-safe .bottom-nav {
      background: #fff !important;
    }
    body.dark .screenshot-safe .banner {
      background:
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.10) 45%, rgba(24,26,31,.92)),
        linear-gradient(120deg, #38513f, #273c49 45%, #4a3921) !important;
    }
    body.dark .screenshot-safe .channels span,
    body.dark .screenshot-safe .links span,
    body.dark .screenshot-safe .tabs {
      color: #a8adb4 !important;
    }
    body.dark .screenshot-safe .bottom-nav {
      background: #181a1f !important;
    }
    .banner-logo {
      color: var(--pink);
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1.4px;
      transform: rotate(-5deg);
      text-shadow: 0 2px 0 rgba(255,255,255,.65), 0 10px 24px rgba(0,0,0,.25);
    }
    .web-left,
    .web-right {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }
    .web-right { justify-content: flex-end; gap: 14px; color: rgba(255,255,255,.96); }
    .logo {
      color: var(--blue);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-right: 4px;
    }
    .search {
      width: 484px;
      height: 38px;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      text-shadow: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f9a8d4, #60a5fa);
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--line);
    }
    .publish {
      background: var(--pink);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
    }
    .channel-area {
      display: grid;
      width: var(--bili-content);
      min-height: 110px;
      margin: 0 auto;
      grid-template-columns: 112px 1fr 230px;
      gap: 16px;
      padding: 20px 0 18px;
      align-items: start;
    }
    .rounds {
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    .round {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }
    .round.dynamic { background: #ff9f1c; }
    .round.hot { background: #f65d8a; }
    .channels {
      display: grid;
      grid-template-columns: repeat(12, minmax(58px, 1fr));
      gap: 8px 10px;
    }
    .channels span,
    .links span {
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--soft);
      color: var(--text);
      font-size: 13px;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-left: 16px;
      border-left: 1px solid var(--line);
    }
    .web-feature {
      width: var(--bili-content);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--bili-gap);
      padding: 0;
      align-items: start;
    }
    .feature-hero-slot,
    .feature-hero {
      grid-column: span 2;
      min-width: 0;
    }
    .feature-hero {
      cursor: pointer;
      min-width: 0;
      height: var(--bili-feature-height);
      overflow: hidden;
      border-radius: 6px;
      background: #1f2329;
      position: relative;
    }
    .hero-carousel {
      height: var(--bili-feature-height);
    }
    .hero-slide {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      transform: none !important;
    }
    .feature-hero .cover::after {
      height: 54%;
      background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.40) 46%, rgba(0,0,0,.12) 72%, transparent);
    }
    .hero-content {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      color: #fff;
      pointer-events: none;
    }
    .hero-title {
      min-width: 0;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hero-dots {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: rgba(255,255,255,.46);
      pointer-events: auto;
      cursor: pointer;
      transition: width .18s ease, background .18s ease;
    }
    .hero-dot.active {
      width: 16px;
      background: #fff;
    }
    .hero-controls {
      position: relative;
      z-index: 4;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .hero-arrow {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,.16);
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .16s ease, transform .16s ease;
    }
    .hero-arrow:hover {
      background: rgba(255,255,255,.24);
      transform: translateY(-1px);
    }
    .feature-side {
      grid-column: span 3;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }
    .web-grid {
      width: var(--bili-content);
      margin: 60px auto 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 40px var(--bili-gap);
      padding: 0 0 70px;
    }
    .web-card {
      min-width: 0;
      cursor: pointer;
    }
    .cover {
      position: relative;
      overflow: hidden;
      background: #dfe3ea center / cover no-repeat;
      border-radius: 6px;
      outline: 0 solid transparent;
      transition: outline-color .15s ease, transform .15s ease;
    }
    .cover:not([data-loaded]) {
      background-image: linear-gradient(120deg, #dfe3ea, #eef1f5 42%, #dfe3ea 78%);
    }
    body.dark .cover:not([data-loaded]) {
      background-image: linear-gradient(120deg, #252932, #303641 42%, #252932 78%);
    }
    .web-card:hover .cover,
    .mobile-card:hover .cover { transform: translateY(-1px); }
    .selected .cover {
      outline: 4px solid rgba(251, 114, 153, .7);
      outline-offset: 0;
    }
    .web-cover { aspect-ratio: 16 / 9; }
    .feature-hero .web-cover {
      height: 100%;
      aspect-ratio: auto;
    }
    .cover::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 38px;
      background: linear-gradient(to top, rgba(0,0,0,.68), rgba(0,0,0,.30) 54%, transparent);
      pointer-events: none;
    }
    .cover-meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      padding: 16px 8px 6px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      white-space: nowrap;
    }
    .cover-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .cover-stat,
    .cover-duration {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .cover-duration {
      flex: 0 0 auto;
      margin-left: auto;
    }
    .meta-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.45));
    }
    .feature-hero .cover-meta {
      font-size: 13px;
    }
    .mobile-cover .cover-meta {
      left: 6px;
      right: 6px;
      bottom: 5px;
      height: auto;
      padding: 0;
      gap: 6px;
      font-size: 10px;
      line-height: 1;
    }
    .mobile-cover .cover-stats {
      gap: 7px;
    }
    .mobile-cover .meta-icon {
      width: 12px;
      height: 12px;
    }
    .web-title {
      margin-top: 10px;
      height: 44px;
      font-size: 15px;
      line-height: 22px;
      color: var(--text);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .feature-hero .web-title {
      margin-top: 0;
      height: 58px;
      padding: 12px 16px 0;
      color: #fff;
      background: linear-gradient(to bottom, #1f2329, #171a20);
      font-size: 16px;
      line-height: 22px;
      -webkit-line-clamp: 1;
    }
    .web-meta {
      margin-top: 4px;
      height: 17px;
      font-size: 13px;
      line-height: 17px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .feature-hero .web-meta {
      display: none;
    }
    .mobile-cover::after {
      height: 32px;
    }
    .change-float {
      position: fixed;
      right: 26px;
      top: 46%;
      z-index: 10;
      width: 44px;
      height: 88px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      line-height: 1.3;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
    }

    .phone-wrap {
      justify-content: center;
      align-items: flex-start;
    }
    .phone {
      width: var(--phone-width);
      height: calc(var(--phone-width) * 2.1667);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      position: relative;
      box-shadow: 0 18px 50px rgba(0,0,0,.14);
    }
    .status {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      font-size: 19px;
      font-weight: 900;
      background: var(--card);
    }
    .status-icons {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .battery {
      width: 27px;
      height: 14px;
      border: 2px solid currentColor;
      border-radius: 4px;
      position: relative;
    }
    .battery::before {
      content: "27";
      position: absolute;
      inset: 1px 4px 1px 2px;
      display: grid;
      place-items: center;
      border-radius: 2px;
      background: currentColor;
      color: var(--card);
      font-size: 9px;
      line-height: 1;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 4px;
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
    }
    .tabs {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 17px;
    }
    .tabs span {
      position: relative;
    }
    .tabs .active {
      color: var(--pink);
      font-weight: 800;
    }
    .tabs .active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -13px;
      height: 3px;
      border-radius: 3px;
      background: var(--pink);
    }
    .feed {
      height: calc(100% - 64px - 52px - 66px);
      overflow: auto;
      padding: 0 6px 12px;
      background: var(--page);
    }
    .feed::-webkit-scrollbar { width: 0; }
    .mobile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .mobile-card {
      background: var(--card);
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
    }
    .mobile-cover {
      aspect-ratio: 1.38 / 1;
      border-radius: 5px 5px 0 0;
    }
    .mobile-title {
      padding: 8px 9px 0;
      min-height: 56px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .mobile-meta {
      height: 33px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .up {
      display: inline-block;
      margin-right: 4px;
      padding: 0 3px;
      border: 1px solid var(--muted);
      border-radius: 3px;
      font-size: 10px;
    }
    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 66px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      background: var(--card);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .bottom-nav .active { color: var(--pink); }
    .plus {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      justify-self: center;
      border-radius: 13px;
      background: var(--pink);
      color: #fff;
      font-size: 28px;
      font-weight: 500;
    }

    .drop-mask {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 99;
      background: rgba(0,0,0,.36);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      pointer-events: none;
    }
    body.dragging .drop-mask { display: grid; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(24,25,28,.92);
      color: #fff;
      font-size: 14px;
      transition: all .2s ease;
    }
    .toast.show {
      opacity: 1;

      { cover: 'covers/特朗普访华专属座驾 他的车都有哪些秘密功能？【野兽一号】.jpg', title: '野兽一号有哪些秘密功能？', owner: '参考UP8', viewText: '1388', danmakuText: '3700', durationText: '14:17', sourceName: "其他博主封面" },

      { cover: 'covers/运动相机三大拍摄技巧·用大疆Action6拍出爆款旅拍vlog！运镜技巧｜调色教程｜创意转场.jpg', title: '运动相机三大拍摄技巧', owner: '参考UP5', viewText: '2476', danmakuText: '2', durationText: '03:00', sourceName: "其他博主封面" },
      { cover: 'covers/这年头，送子观音来了，都不好使！.jpg', title: '这年头，送子观音来了都不好使', owner: '参考UP6', viewText: '185.1万', danmakuText: '2678', durationText: '11:11', sourceName: "其他博主封面" },
      { cover: 'covers/陈小姐评《给阿嬷的情书》：可以讲几句真话吗？.jpg', title: '可以讲几句真话吗？', owner: '参考UP7', viewText: '2518', danmakuText: '824', durationText: '02:19', sourceName: "其他博主封面" },
      { cover: 'covers/音效：118个剪辑师必备数码相机快门、对焦、变焦、闪光灯、连拍、倒计时、开机、关机摄像机电影广告短片剪辑音效素材.jpg', title: '118个剪辑师必备相机音效素材', owner: '参考UP8', viewText: '264.2万', danmakuText: '31', durationText: '08:38', sourceName: "其他博主封面" },
      { cover: 'covers/高铁运行地图路线模拟动画，用AE的GEOlayers做出来的.jpg', title: '高铁运行地图路线模拟动画', owner: '参考UP9', viewText: '1.8万', danmakuText: '3700', durationText: '07:41', sourceName: "其他博主封面" }
    ];

    const app = document.getElementById("app");
    const coverInput = document.getElementById("coverInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const randomBtn = document.getElementById("randomBtn");
    const screenshotBtn = document.getElementById("screenshotBtn");
    const desktopBtn = document.getElementById("desktopBtn");
    const phoneBtn = document.getElementById("phoneBtn");
    const themeBtn = document.getElementById("themeBtn");
    const changeBtn = document.getElementById("changeBtn");
    const titleBtn = document.getElementById("titleBtn");
    const titleBar = document.getElementById("titleBar");
    const titleInput = document.getElementById("titleInput");
    const markBtn = document.getElementById("markBtn");
    const sponsorBtn = document.getElementById("sponsorBtn");
    const sponsorModal = document.getElementById("sponsorModal");
    const sponsorClose = document.getElementById("sponsorClose");
    const heroGrid = document.getElementById("heroGrid");
    const sideGrid = document.getElementById("sideGrid");
    const webGrid = document.getElementById("webGrid");
    const mobileGrid = document.getElementById("mobileGrid");
    const toast = document.getElementById("toast");
    const hint = document.getElementById("hint");

    let selectedSlot = 0;
    let userCover = null;
    let items = [];
    let filePickerLastOpen = 0;
    let coverObserver = null;
    let html2CanvasPromise = null;
    const HERO_SLIDE_COUNT = 9;
    let heroActiveIndex = 0;
    let heroTimer = null;

    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetItems() {
      items = shuffle(competitorCovers).slice(0, 22).map(item => ({ ...item, mine: false }));
      if (userCover) items[selectedSlot] = { ...items[selectedSlot], ...userCover, mine: true };
      heroActiveIndex = 0;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }

    function cssUrl(value) {
      return `url("${String(value ?? "").replace(/["\\\n\r]/g, "\\$&")}")`;
    }

    function openCoverPicker(event) {
      if (event && event.button !== undefined && event.button !== 0) return;
      if (event) event.preventDefault();
      const now = Date.now();
      if (now - filePickerLastOpen < 700) return;
      filePickerLastOpen = now;
      try {
        if (typeof coverInput.showPicker === "function") coverInput.showPicker();
        else coverInput.click();
      } catch {
        coverInput.click();
      }
    }

    function loadCoverElement(cover) {
      if (!cover || cover.dataset.loaded || !cover.dataset.cover) return;
      cover.style.backgroundImage = cssUrl(cover.dataset.cover);
      cover.dataset.loaded = "true";
    }

    function fileFromDrop(event) {
      const files = Array.from(event.dataTransfer?.files || []);
      return files.find(file => file.type.startsWith("image/"));
    }

    function handleDroppedCover(event, slot = selectedSlot) {
      event.preventDefault();
      event.stopPropagation();
      document.body.classList.remove("dragging");
      const file = fileFromDrop(event);
      if (!file) {
        showToast("请拖入图片文件");
        return;
      }
      useFile(file, slot);
    }

    function prepareLazyCovers() {
      const covers = Array.from(document.querySelectorAll(".cover[data-cover]:not([data-loaded])"));
      if (!covers.length) return;
      if (coverObserver) coverObserver.disconnect();

      const loadVisibleBatch = () => {
        const fold = window.innerHeight + 80;
        covers.forEach(cover => {
          const rect = cover.getBoundingClientRect();
          if (rect.width < 1 || rect.height < 1) return;
          if (rect.top < fold && rect.bottom > -80) loadCoverElement(cover);
        });
      };

      requestAnimationFrame(() => {
        loadVisibleBatch();
        const idle = window.requestIdleCallback || (callback => setTimeout(callback, 180));
        idle(() => covers.slice(0, 7).forEach(loadCoverElement), { timeout: 900 });
      });

      if ("IntersectionObserver" in window) {
        coverObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadCoverElement(entry.target);
            coverObserver.unobserve(entry.target);
          });
        }, { rootMargin: "160px 0px" });
        covers.forEach(cover => coverObserver.observe(cover));
      } else {
        covers.forEach(loadCoverElement);
      }
    }

    function ensureHtml2Canvas() {
      if (window.html2canvas) return Promise.resolve(window.html2canvas);
      if (!html2CanvasPromise) {
        html2CanvasPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "./assets/vendor/html2canvas.min.js";
          script.onload = () => resolve(window.html2canvas);
          script.onerror = () => reject(new Error("html2canvas unavailable"));
          document.head.appendChild(script);
        });
      }
      return html2CanvasPromise;
    }

    function waitForImage(src) {
      if (!src || src.startsWith("data:")) return Promise.resolve();
      return new Promise(resolve => {
        const image = new Image();
        const done = () => resolve();
        const timer = setTimeout(done, 3200);
        image.onload = image.onerror = () => {
          clearTimeout(timer);
          done();
        };
        image.src = src;
      });
    }

    async function prepareScreenshotTarget(target) {
      const covers = Array.from(target.querySelectorAll(".cover[data-cover]"));
      covers.forEach(loadCoverElement);
      await Promise.all(covers.map(cover => waitForImage(cover.dataset.cover)));
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function meta(item) {
      return `
        <div class="cover-meta">
          <span class="cover-stats">
            <span class="cover-stat">
              <svg class="meta-icon" viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.2" y="3.6" width="15.6" height="12.8" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <path d="M8.2 7.2v5.6l4.8-2.8-4.8-2.8z" fill="currentColor"/>
              </svg>
              ${esc(item.viewText)}
            </span>
            <span class="cover-stat">
              <svg class="meta-icon" viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.2" y="4.1" width="15.6" height="11.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M6 7.6h8M6 10.1h6M6 12.6h4.4" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>
              </svg>
              ${esc(item.danmakuText)}
            </span>
          </span>
          <span class="cover-duration">${esc(item.durationText)}</span>
        </div>
      `;
    }

    function selectSlot(slot) {
      selectedSlot = Number(slot);
      render();
      showToast(`已选中第 ${selectedSlot + 1} 个位置，导入后会替换这里`);
    }

    function displayTitle(item) {
      return item.mine && userCover.title ? userCover.title : item.title;
    }

    function getHeroSlides() {
      const slides = items.slice(0, Math.min(HERO_SLIDE_COUNT, items.length));
      if (heroActiveIndex >= slides.length) heroActiveIndex = 0;
      return slides;
    }

    function setHeroSlide(index, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const slides = getHeroSlides();
      if (!slides.length) return;
      heroActiveIndex = (index + slides.length) % slides.length;
      render();
    }

    function scheduleHeroTimer() {
      clearInterval(heroTimer);
      const slides = getHeroSlides();
      if (slides.length < 2) return;
      heroTimer = setInterval(() => {
        if (!app.classList.contains("mode-desktop")) return;
        heroActiveIndex = (heroActiveIndex + 1) % slides.length;
        render();
      }, 5000);
    }

    function makeHeroCarousel() {
      const slides = getHeroSlides();
      const item = slides[heroActiveIndex] || items[0];
      const card = document.createElement("article");
      card.className = `feature-hero hero-carousel${selectedSlot === 0 || item?.mine ? " selected" : ""}`;
      card.innerHTML = `
        <div class="cover web-cover hero-slide${item?.mine ? ' mine' : ''}" data-cover="${esc(item?.cover || '')}"></div>
        <div class="hero-content">
          <div class="hero-copy">
            <div class="hero-title">${esc(displayTitle(item || {}))}</div>
            <div class="hero-dots" aria-label="轮播位置">
              ${slides.map((_, index) => `<button class="hero-dot${index === heroActiveIndex ? ' active' : ''}" data-hero-dot="${index}" type="button" aria-label="第 ${index + 1} 张"></button>`).join("")}
            </div>
          </div>
          <div class="hero-controls" aria-label="手动切换">
            <button class="hero-arrow" data-hero-dir="-1" type="button" aria-label="上一张">‹</button>
            <button class="hero-arrow" data-hero-dir="1" type="button" aria-label="下一张">›</button>
          </div>
        </div>
      `;
      card.addEventListener("click", () => selectSlot(0));
      card.addEventListener("dblclick", openCoverPicker);
      card.addEventListener("dragover", event => event.preventDefault());
      card.addEventListener("drop", event => handleDroppedCover(event, 0));
      card.querySelectorAll("[data-hero-dot]").forEach(button => {
        button.addEventListener("click", event => setHeroSlide(Number(button.dataset.heroDot), event));
      });
      card.querySelectorAll("[data-hero-dir]").forEach(button => {
        button.addEventListener("click", event => setHeroSlide(heroActiveIndex + Number(button.dataset.heroDir), event));
      });
      return card;
    }

    function makeWebCard(item, slot) {
      const card = document.createElement("article");
      card.className = `web-card${slot === selectedSlot || item.mine ? " selected" : ""}`;
      card.innerHTML = `
        <div class="cover web-cover${item.mine ? ' mine' : ''}" data-cover="${esc(item.cover)}">
          ${meta(item)}
        </div>
        <div class="web-title">${esc(displayTitle(item))}</div>
        <div class="web-meta">${esc(item.owner)} · ${esc(item.sourceName || "推荐")}</div>
      `;
      card.addEventListener("click", () => selectSlot(slot));
      card.addEventListener("dblclick", openCoverPicker);
      card.addEventListener("dragover", event => event.preventDefault());
      card.addEventListener("drop", event => handleDroppedCover(event, slot));
      return card;
    }

    function makeMobileCard(item, slot) {
      const card = document.createElement("article");
      card.className = `mobile-card${slot === selectedSlot || item.mine ? " selected" : ""}`;
      card.innerHTML = `
        <div class="cover mobile-cover${item.mine ? ' mine' : ''}" data-cover="${esc(item.cover)}">
          ${meta(item)}
        </div>
        <div class="mobile-title">${esc(displayTitle(item))}</div>
        <div class="mobile-meta"><span><b class="up">UP</b>${esc(item.owner)}</span><span>⋮</span></div>
      `;
      card.addEventListener("click", () => selectSlot(slot));
      card.addEventListener("dblclick", openCoverPicker);
      card.addEventListener("dragover", event => event.preventDefault());
      card.addEventListener("drop", event => handleDroppedCover(event, slot));
      return card;
    }

    function render() {
      heroGrid.innerHTML = "";
      sideGrid.innerHTML = "";
      webGrid.innerHTML = "";
      mobileGrid.innerHTML = "";
      heroGrid.appendChild(makeHeroCarousel());
      items.forEach((item, slot) => {
        if (slot > 0 && slot <= 6) sideGrid.appendChild(makeWebCard(item, slot));
        else if (slot > 6) webGrid.appendChild(makeWebCard(item, slot));
        if (slot < 10) mobileGrid.appendChild(makeMobileCard(item, slot));
      });
      hint.textContent = userCover
        ? "双击任意封面位也能替换；随机封面会保留你的封面，只重排周围环境。"
        : `已内置 ${competitorCovers.length} 张其他博主封面，导入你的封面即可开始比较。`;
      prepareLazyCovers();
      scheduleHeroTimer();
    }

    function setMode(mode) {
      const desktop = mode === "desktop";
      app.classList.toggle("mode-desktop", desktop);
      app.classList.toggle("mode-phone", !desktop);
      desktopBtn.classList.toggle("active", desktop);
      phoneBtn.classList.toggle("active", !desktop);
      prepareLazyCovers();
      showToast(desktop ? "已切到网页端" : "已切到手机端");
    }

    function useFile(file, slot = selectedSlot) {
      if (!file || !file.type.startsWith("image/")) {
        showToast("请选择图片文件");
        return;
      }
      const targetSlot = Number(slot);
      selectedSlot = Number.isFinite(targetSlot) ? targetSlot : selectedSlot;
      const reader = new FileReader();
      reader.onload = event => {
        const randomTitle = competitorCovers[Math.floor(Math.random() * competitorCovers.length)].title;
        userCover = {
          cover: event.target.result,
          mine: true,
          title: randomTitle
        };
        titleInput.value = randomTitle;
        items[selectedSlot] = { ...items[selectedSlot], ...userCover };
        if (selectedSlot === 0) heroActiveIndex = 0;
        render();
        showToast("已导入你的封面");
      };
      reader.readAsDataURL(file);
    }

    function randomizeEnvironment() {
      const oldSlot = selectedSlot;
      resetItems();
      selectedSlot = oldSlot;
      if (userCover) items[selectedSlot] = { ...items[selectedSlot], ...userCover };
      render();
      showToast(userCover ? "已重排竞品封面，你的封面已保留" : "已随机展示其他博主封面");
    }

    function canvasToBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    }

    function getVisibleRect(target) {
      const rect = target.getBoundingClientRect();
      const left = Math.max(0, rect.left);
      const top = Math.max(0, rect.top);
      const right = Math.min(window.innerWidth, rect.right);
      const bottom = Math.min(window.innerHeight, rect.bottom);
      return {
        left,
        top,
        width: Math.max(1, right - left),
        height: Math.max(1, bottom - top)
      };
    }

    function downloadBlob(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "B站封面预览.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    }

    async function copyScreenshot() {
      const target = app.classList.contains("mode-phone")
        ? document.getElementById("phoneView")
        : document.getElementById("desktopView");
      const isPhone = app.classList.contains("mode-phone");

      try {
        if (location.protocol === "file:") {
          showToast("截图请双击文件夹里的“打开预览.command”后再使用");
          return;
        }
        const html2canvas = await ensureHtml2Canvas();
        target.classList.add("screenshot-safe");
        await prepareScreenshotTarget(target);
        const visible = getVisibleRect(target);
        const screenshotTarget = isPhone ? target : document.body;
        const options = {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          backgroundColor: null,
          logging: false,
          imageTimeout: 8000
        };
        if (!isPhone) {
          Object.assign(options, {
            x: visible.left + window.scrollX,
            y: visible.top + window.scrollY,
            width: Math.round(visible.width),
            height: Math.round(visible.height),
            scrollX: window.scrollX,
            scrollY: window.scrollY
          });
        }
        const canvas = await html2canvas(screenshotTarget, options);
        const blob = await canvasToBlob(canvas);
        if (!blob) throw new Error("screenshot blob unavailable");
        if (!navigator.clipboard || !window.ClipboardItem) {
          downloadBlob(blob);
          showToast("已下载截图（当前浏览器不支持直接复制到剪贴板）");
          return;
        }
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(isPhone ? "手机端预览已复制到剪贴板" : "当前可见预览已复制到剪贴板");
        } catch (clipboardError) {
          console.warn(clipboardError);
          downloadBlob(blob);
          showToast("浏览器拒绝剪贴板，已改为下载截图");
        }
      } catch (error) {
        console.error(error);
        showToast("截图失败，请刷新后再试");
      } finally {
        target.classList.remove("screenshot-safe");
      }
    }

    uploadBtn.addEventListener("pointerdown", openCoverPicker);
    uploadBtn.addEventListener("click", openCoverPicker);
    coverInput.addEventListener("change", event => {
      useFile(event.target.files[0]);
      event.target.value = "";
    });
    randomBtn.addEventListener("click", randomizeEnvironment);
    changeBtn.addEventListener("click", randomizeEnvironment);
    desktopBtn.addEventListener("click", () => setMode("desktop"));
    phoneBtn.addEventListener("click", () => setMode("phone"));
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      themeBtn.textContent = document.body.classList.contains("dark") ? "浅色模式" : "深色模式";
      showToast(document.body.classList.contains("dark") ? "已开启深色模式" : "已切回浅色模式");
    });
    titleBtn.addEventListener("click", () => {
      const on = titleBar.toggleAttribute("hidden");
      titleBtn.classList.toggle("primary", !on);
      if (!on && userCover) {
        titleInput.focus();
        showToast("在输入框输入标题，封面实时更新");
      }
    });
    titleInput.addEventListener("input", () => {
      if (userCover) {
        userCover.title = titleInput.value;
        render();
      }
    });
    markBtn.addEventListener("click", () => {
      if (!userCover) { showToast("请先导入你的封面"); return; }
      const on = app.classList.toggle("highlight-mode");
      markBtn.classList.toggle("primary", on);
      showToast(on ? "已标记你的封面 — 粉框高亮" : "已关闭封面标记");
    });
    sponsorBtn.addEventListener("click", () => {
      sponsorModal.classList.add("show");
      sponsorModal.setAttribute("aria-hidden", "false");
    });
    sponsorClose.addEventListener("click", () => {
      sponsorModal.classList.remove("show");
      sponsorModal.setAttribute("aria-hidden", "true");
    });
    sponsorModal.addEventListener("click", event => {
      if (event.target === sponsorModal) sponsorClose.click();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && sponsorModal.classList.contains("show")) sponsorClose.click();
    });
    screenshotBtn.addEventListener("click", copyScreenshot);

    document.addEventListener("dragover", event => {
      event.preventDefault();
      document.body.classList.add("dragging");
    });
    document.addEventListener("dragleave", event => {
      if (!event.relatedTarget) document.body.classList.remove("dragging");
    });
    document.addEventListener("drop", event => {
      handleDroppedCover(event);
    });

    resetItems();
    render();
    app.classList.add("highlight-mode");
    markBtn.classList.add("primary");
    const idle = window.requestIdleCallback || (callback => setTimeout(callback, 600));
    idle(() => ensureHtml2Canvas().catch(() => {}), { timeout: 2200 });
  </script>
